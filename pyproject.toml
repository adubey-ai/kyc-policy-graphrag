[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-policy-graphrag"
version = "1.0.0"
description = "Hybrid Graph RAG for KYC and AML policy reasoning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adarsh Dubey" }]
dependencies = [
  "fastapi>=0.115",
  "networkx>=3.2",
  "numpy>=1.26",
  "pydantic>=2.8",
  "pypdf>=5.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]
dev = ["httpx>=0.27", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kyc-graphrag = "kyc_graphrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::Warning:fastapi.testclient",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
